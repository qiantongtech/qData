version: "3.8"

services:
  # qdata 后端服务
  qdata-api:
    image: ${QDATA_HUB}/qdata-server-ce:${QDATA_TAG}
    restart: always
    profiles: [ "all" ]
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
#    ports:
#      - "8080:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./qdata-server/logs:/usr/app/jar/logs
      - ./qdata-server/upload:/usr/app/jar/upload
      - ./qdata-server/application-prod.yml:/usr/app/jar/application-prod.yml
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - qdatanet

  # qdata 质控服务
  qdata-quality:
    image: ${QDATA_HUB}/qdata-quality-ce:${QDATA_TAG}
    restart: always
    profiles: [ "all" ]
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
#    ports:
#      - "8083:8083"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./qdata-quality/logs:/usr/app/jar/logs
      - ./qdata-quality/job-log:/usr/app/jar/job-log
      - ./qdata-quality/application-prod.yml:/usr/app/jar/application-prod.yml
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - qdatanet

  # qdata 后端服务
  qdata-ai:
    privileged: true
    image: ${QDATA_HUB}/qdata-ai-ce:${QDATA_TAG}
    restart: always
    profiles: [ "all" ]
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
    #    ports:
    #      - "8087:8087"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./qdata-ai/logs:/usr/app/jar/logs
      - ./qdata-ai/application-prod.yml:/usr/app/jar/application-prod.yml
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - qdatanet
    extra_hosts:
      - "host.docker.internal:host-gateway"
