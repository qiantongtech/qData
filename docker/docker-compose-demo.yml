version: "3.8"

services:
  mysql57:
    image: mysql:5.7
    profiles: [ "demo", "mysql" ]
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "sfdjfFF#s2332"
      TZ: "Asia/Shanghai"
#    ports:
#      - "3306:3306"
    volumes:
      - ./demo/mysql/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./demo/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - qdatanet

  oracle11g:
    image: wnameless/oracle-xe-11g-r2
    profiles: [ "demo", "oracle" ]
    environment:
      - TZ=Asia/Shanghai
      - ORACLE_ALLOW_REMOTE=true
      - ORACLE_PASSWORD=Your!Str0ngPass
      - NLS_LANG=AMERICAN_AMERICA.AL32UTF8
#    ports:
#      - "1521:1521"
    volumes:
      - ./demo/oracle/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    networks:
      - qdatanet

  dm8-demo:
    image: ${QDATA_HUB}/dm8:mixed
    profiles: [ "demo", "dm8-demo" ]
    env_file: .env
    privileged: true
    restart: always
#    ports:
#      - "15236:5236"
    volumes:
      - ./demo/dm8/init-qdata.sql:/home/dmdba/initdata/init-qdata.sql
      - ./demo/dm8/entrypoint.sh:/entrypoint.sh
      - ./demo/dm8/entrypoint-arm64.sh:/usr/local/bin/docker-entrypoint.sh
    environment:
      - TZ=${TZ}
      - CASE_SENSITIVE=${CASE_SENSITIVE}
      - SYSDBA_PWD=${SYSDBA_PWD}
      - SYSAUDITOR_PWD=${SYSAUDITOR_PWD}
      - QDATA_USER=${DEMO_USER}
      - QDATA_PWD=${DEMO_PWD}
    healthcheck:
      test: [ "CMD-SHELL", "echo > /dev/tcp/127.0.0.1/5236" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - qdatanet
