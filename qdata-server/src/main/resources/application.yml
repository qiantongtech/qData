# Project related configuration
qdata:
  # Name
  name: qData
  # Version
  version: 3.8.8
  # author
  author: 千桐科技
  # description
  description: qData Open-Source Data Platform
  # Copyright year
  copyrightYear: 2024
  # File path example (Windows configuration D:/qdata/uploadPath, Linux configuration /home/qdata/uploadPath) -- needs to be consistent with the file module
  profile: ${user.dir}/upload/
  # Get ip address switch
  addressEnabled: false
  # Verification code type math numerical calculation char character verification
  captchaType: math

# Development environment configuration
server:
  # The HTTP port of the server, default is 8080
  port: 8080
  servlet:
    # Application access path
    context-path: /
  tomcat:
    # tomcat URI encoding
    uri-encoding: UTF-8
    # The number of queues after the number of connections is full, the default is 100
    accept-count: 1000
    threads:
      # The maximum number of threads in tomcat, the default is 200
      max: 800
      # The number of threads that Tomcat starts initializing, the default value is 10
      min-spare: 100

# Log configuration
logging:
  level:
    tech.qiantong: debug
    org.springframework: warn

# User configuration
user:
  password:
    # Maximum number of incorrect passwords
    maxRetryCount: 5
    # Password lock time (default 10 minutes)
    lockTime: 10
    #Universal password will not take effect if it is empty.
    universalPassword: qData123

# Spring configuration
spring:
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml
  thymeleaf:
    prefix: classpath:/dist/
    mode: HTML
    encoding: utf-8
    cache: false
  # Resource information
  messages:
    # Internationalized resource file path (multiple modules are loaded, searched in order, the one that matches first takes effect)
    # messages: qdata-server public messages (system exception/user authentication/file upload)
    # system-messages: System module exclusive (data permissions, etc.)
    # dm-messages: Exclusive to DM module (data import/subject field, etc.)
    # dg-messages: Exclusive to DG module (data governance/desensitization, etc.)
    # att-messages: Exclusive to ATT module (asset classification/label, etc.)
    # da-messages: Exclusive to DA module (data assets/discovery tasks, etc.)
    # dp-messages: Exclusive to DP module (data standards/models/data elements, etc.)
    # dpp-messages: Exclusive to DPP module (data development/ETL/scheduling, etc.)
    # ds-messages: Exclusive to DS module (data service/API, etc.)
    # mc-messages: exclusive to MC module (metadata collection/scheduling, etc.)
    # quality-messages: exclusive to the data quality module
    basename: i18n/messages,i18n/system-messages,i18n/dm-messages,i18n/dg-messages,i18n/att-messages,i18n/da-messages,i18n/dp-messages,i18n/dpp-messages,i18n/ds-messages,i18n/mc-messages,i18n/quality-messages,i18n/log-messages,i18n/etl-messages
    encoding: UTF-8
  profiles:
    active: dev  # The environment activated by default, which can be overridden at startup
  config:
    import:
      - "application-${spring.profiles.active}.yml"
      - "classpath:application-auth-${spring.profiles.active}.yml"
      - "classpath:application-file-${spring.profiles.active}.yml"
      # Instructions: Introduce the business module configuration file (please adjust according to the project situation)
      - "classpath:application-system-${spring.profiles.active}.yml"
      - "classpath:application-mc-${spring.profiles.active}.yml"
  # File upload
  servlet:
    multipart:
      # Single file size
      max-file-size: 3000MB
      # Set the total uploaded file size
      max-request-size: 3000MB
  # Service module
  devtools:
    restart:
      # Hot deployment switch
      enabled: true

# token configuration
token:
  # Token custom identification
  header: Authorization
  # Token custom identification
  rpHeader: token
  # Token key
  secret: abcdefghijklmnopqrstuvwxyz
  # Token validity period (default 30 minutes)
  expireTime: 600

# MyBatis configuration
# mybatis:
  # Search for a specified package alias
  # typeAliasesPackage: tech.qiantong.**.domain
  # Configure mapper scanning to find all mapper.xml mapping files
  # mapperLocations: classpath*:mapper/**/*Mapper.xml
  # Load global configuration file
  # configLocation: classpath:mybatis/mybatis-config.xml

# MyBatis Plus configuration
mybatis-plus:
  # Search for a specified package alias
  typeAliasesPackage: tech.qiantong.**.dataobject,tech.qiantong.**.dataobject.assetchild, tech.qiantong.**.domain
  # Configure mapper scanning to find all mapper.xml mapping files
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # Load global configuration file
  configLocation: classpath:mybatis/mybatis-config.xml
  global-config:
    # Close the Banner of MyBatis-Plus
    banner: false
    db-config:
      # Primary key type AUTO auto-increment NONE empty INPUT user input ASSIGN_ID snowflake ASSIGN_UUID unique UUID
      idType: AUTO
      # Global tombstone field name
      logic-delete-field: delFlag
      # Logical deleted value (default is 1)
      logic-delete-value: 1
      # Logical undeleted value (default 0)
      logic-not-delete-value: 0
      # Field validation strategy for insert, field validation strategy during insert IGNORED ignore NOT_NULL non-NULL NOT_EMPTY non-empty DEFAULT default NEVER do not join SQL
      insertStrategy: NOT_NULL
      # Field validation strategy update, field validation strategy during update
      updateStrategy: NOT_NULL
      # Field validation strategy for select, the field validation strategy during select is wrapper based on the where condition generated by the internal entity
      where-strategy: NOT_NULL

mybatis-plus-join:
  # Whether to print mybatis plus join banner, default true
  banner: false
  # Globally enable logical deletion of secondary tables, default true. After closing, the related query will not add the logical deletion of the secondary table.
  sub-table-logic: true
  # Interceptor MappedStatement cache, default true
  ms-cache: true
  # Table alias (default t)
  table-alias: t
  # The position of the logical deletion condition of the secondary table, supports WHERE and ON, and defaults to ON
  logic-del-type: on

# PageHelper paging plug-in
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Prevent XSS attacks
xss:
  # Filter switch
  enabled: true
  # Exclude links (separate multiple with commas)
  excludes: /system/notice
  # Matching link
  urlPatterns: /system/*,/monitor/*,/tool/*

# Swagger group configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'system'
      paths-to-match: '/**'
      packages-to-scan: tech.qiantong.qdata.module.system.controller
    - group: 'example'
      paths-to-match: '/**'
      packages-to-scan: tech.qiantong.qdata.module.example.controller
    - group: 'ai'
      paths-to-match: '/**'
      packages-to-scan: tech.qiantong.qdata.module.ai.controller
    - group: 'dm'
      paths-to-match: '/**'
      packages-to-scan: tech.qiantong.qdata.module.dm.controller
# Swagger enhanced configuration
knife4j:
  enable: true
  documents:
    -
      group: 2.x Version
      name: API Signature
      locations: classpath:sign/*
  setting:
    language: zh-CN
    enable-swagger-models: true
    enable-document-manage: true
    swagger-model-name: Model List
    enable-version: false
    enable-reload-cache-parameter: false
    enable-after-script: true
    enable-filter-multipart-api-method-type: POST
    enable-filter-multipart-apis: false
    enable-request-cache: true
    enable-host: false
    enable-host-text: 127.0.0.1:8080
    enable-home-custom: true
    home-custom-path: classpath:markdown/home.md
    enable-search: false
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: Apache License 2.0 | Copyright  2025-[Jiangsu Qiantong Technology Co., Ltd.])
    enable-dynamic-parameter: false
    enable-debug: true
    enable-open-api: true
    enable-group: true
  cors: false
  production: false
  basic:
    enable: true
    username: test
    password: 12313

##Access address of workflow module
flyflow:
  url: http://127.0.0.1:26859/

#The ID generator is used for future applications of distributed unique IDs.
#Work machine ID (0~31)
id.workerId: 1
#Data center ID (0~31)
id.datacenterId: 1
