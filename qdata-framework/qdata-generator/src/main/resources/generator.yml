gen:
  # Author
  author: qdata
  # The default generated package path system needs to be changed to your own module name, such as system monitor tool
  packageName: tech.qiantong.qdata.module.[moduleName]
  # Automatically remove table prefix, default is false
  autoRemovePre: false
  # Table prefix (the generated class name will not contain the table prefix, multiple ones are separated by commas)
  tablePrefix: sys_
