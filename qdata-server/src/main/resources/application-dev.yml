# Primary data source selection
datasource:
  type: mysql

# Spring configuration
spring:
  # Redis configuration
  redis:
    # Address
    host: 127.0.0.1
    # Port, defaults to 6379
    port: 6379
    # Database index
    database: 0
    # Password
    password:
    # Connection timeout
    timeout: 10s
    lettuce:
      pool:
        # Minimum idle connections in the connection pool
        min-idle: 0
        # Maximum idle connections in the connection pool
        max-idle: 8
        # Maximum database connections in the connection pool
        max-active: 8
        # Maximum blocking wait time for the connection pool (use a negative value for no limit)
        max-wait: -1ms
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: username
    password: password
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 1
        max-concurrency: 10
  data:
    neo4j:
      uri: bolt://127.0.0.1:7687
      username: neo4j
      password: password
  datasource:
    druid:
      stat-view-servlet:
        # Whether to enable Druid monitoring statistics
        enabled: false
        # Username for accessing the Druid monitoring page
        loginUsername: qdata
        # Password for accessing the Druid monitoring page
        loginPassword: 123456
    dynamic:
      druid:
        # Number of connections created when the connection pool is initialized
        initial-size: 5
        # Minimum idle connections in the connection pool
        min-idle: 5
        # Maximum active connections in the connection pool
        maxActive: 20
        # Maximum time to wait for a connection from the pool (milliseconds)
        maxWait: 60000
        # Database connection timeout (milliseconds)
        connectTimeout: 30000
        # Socket timeout (milliseconds)
        socketTimeout: 60000
        # Idle connection check interval (milliseconds)
        timeBetweenEvictionRunsMillis: 60000
        # Minimum lifetime of idle connections (milliseconds)
        minEvictableIdleTimeMillis: 300000
        # SQL statement used to validate connections
        validationQuery: SELECT 1 FROM DUAL
        # Whether to validate connections while idle
        testWhileIdle: true
        # Whether to validate connections when borrowed
        testOnBorrow: false
        # Whether to validate connections when returned
        testOnReturn: false
        # Whether to enable the PreparedStatement cache for the connection pool
        poolPreparedStatements: true
        # Maximum PreparedStatement cache size per connection pool
        maxPoolPreparedStatementPerConnectionSize: 20
        # Configure Druid filters
        filters: stat,slf4j
        # Druid connection properties
        connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
      datasource:
        # Primary database data source configuration
        master:
          # Dynamically loaded configuration properties
          driver-class-name: ${${datasource.type}.driver-class-name}
          url: ${${datasource.type}.url}
          username: ${${datasource.type}.username}
          password: ${${datasource.type}.password}
#        test:
#          driver-class-name: dm.jdbc.driver.DmDriver
#          url: jdbc:dm://127.0.0.1:5236/MOON?STU&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8&schema=MOON&serverTimezone=Asia/Shanghai
#          username: MOON
#          password: 1234567890

# MySQL configuration
mysql:
  # JDBC driver class name
  driver-class-name: com.mysql.cj.jdbc.Driver
  # Primary database JDBC connection URL
  url: jdbc:mysql://mysql:3306/qdata?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
  # Primary database username
  username: root
  # Primary database password
  password: o5KjnPYxswsiURZHCPwd

# DM configuration
dm8:
  # JDBC driver class name
  driver-class-name: dm.jdbc.driver.DmDriver
  # Primary database JDBC connection URL
  url: jdbc:dm://127.0.0.1:5236/QDATA?STU&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8&schema=QDATA&serverTimezone=Asia/Shanghai
  # Primary database username
  username: QDATA
  # Primary database password
  password: password

# Kingbase configuration
kingbase8:
  # JDBC driver class name
  driver-class-name: com.kingbase8.Driver
  # Primary database JDBC connection URL
  url: jdbc:kingbase8://127.0.0.1:54321/qdata_dev?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&currentSchema=qdata
  # Primary database username
  username: kingbase
  # Primary database password
  password: 123456

# Oracle 12c configuration
oracle:
  # JDBC driver class name
  driver-class-name: oracle.jdbc.OracleDriver
  # Primary database JDBC connection URL
  url: jdbc:oracle:thin:@127.0.0.1:1521:xe?oracle.jdbc.timezoneAsRegion=true&oracle.jdbc.defaultTimezone=Asia/Shanghai&currentSchema=ANIVIA
  # Primary database username
  username: ANIVIA
  # Primary database password
  password: ANIVIA

# Scheduler-related configuration
ds:
  # Scheduler API prefix
  base_url: http://127.0.0.1:12345/dolphinscheduler
  # Data quality service component HTTP address
  quality_url: http://127.0.0.1:8083/quality/qualityTaskExecutor/runExecuteTask
  # Metadata collection task API prefix
  mc_url: http://localhost:8080/mc/taskExecutor/runExecuteTask
  # DolphinScheduler project code for data quality tasks
  http_quality_projectCode: 134799536571008
  # DolphinScheduler project code for metadata collection tasks
  http_mc_projectCode: 173091707675808
  # Scheduler token (can be modified as needed)
  token: b07f0e57c4818043a57ba05a28da291a
  # Resource center path
  resource_url: /dolphinscheduler/
  # Spark-related configuration
  spark:
    # Spark master address
    master_url: spark://127.0.0.1:7077
    # JAR package path in DolphinScheduler
    main_jar: file:/dolphinscheduler/default/resources/spark-jar/qdata-etl.jar
    # JAR main entry point
    main_class: tech.qiantong.qdata.spark.etl.EtlApplication
  # HDFS-related configuration
  hdfs:
    # NameNode RPC address (client entry address for connecting to HDFS)
    url: hdfs://127.0.0.1:8020
  # Scheduler Redis configuration (used to obtain the latest data source information and ensure task execution)
  redis:
    # Address
    host: 127.0.0.1
    # Port, defaults to 6379
    port: 12138
    # Database index
    database: 0
    # Password
    password:

datax:
  # DataX root directory, can be overridden by QDATA_DATAX_HOME
  home: ${user.dir}/datax
  # Python command
  python-command: python3
  # Path to the datax.py invocation file
  datax-py-path: ${user.dir}/datax/bin/datax.py
  # DataX lib directory
  lib-dir: ${user.dir}/datax/lib
  # Directory where qData generates DataX Job JSON files
  job-dir: ${user.dir}/upload/datax/job

path:
  # Data quality service prefix
  quality_url: http://127.0.0.1:8083/quality/qualityTaskExecutor
  mc_url: http://localhost:8080/mc/taskExecutor
