datasource:
  type: mysql

# Spring configuration
spring:
  # redis configuration
  data:
    redis:
      # Address
      host: 127.0.0.1
      # Port, default is 6379
      port: 6379
      # Database index
      database: 0
      # Password
      password:
      # Connection timeout
      timeout: 10s
      lettuce:
        pool:
          # Minimum idle connections in the connection pool
          min-idle: 0
          # Maximum idle connections in the connection pool
          max-idle: 8
          # Maximum number of database connections for the connection pool
          max-active: 8
          # #The maximum blocking waiting time of the connection pool (use a negative value to indicate no limit)
          max-wait: -1ms
  datasource:
    druid:
      stat-view-servlet:
        # Whether to enable Druid’s monitoring statistics function
        enabled: false
        # Username to access the Druid monitoring page
        loginUsername: qdata
        # Password to access Druid monitoring page
        loginPassword: 123456
    dynamic:
      druid:
        # The number of connections created when the connection pool is initialized
        initial-size: 5
        # Minimum number of idle connections in the connection pool
        min-idle: 5
        # Maximum number of active connections in the connection pool
        maxActive: 20
        # Maximum time the connection pool waits for a connection (milliseconds)
        maxWait: 60000
        # Database connection timeout (milliseconds)
        connectTimeout: 30000
        # Socket timeout (milliseconds)
        socketTimeout: 60000
        # Idle connection detection period (milliseconds)
        timeBetweenEvictionRunsMillis: 60000
        # Minimum idle connection lifetime (milliseconds)
        minEvictableIdleTimeMillis: 300000
        # SQL statement used to check whether the connection is valid
        validationQuery: SELECT 1 FROM DUAL
        # Whether to check the validity of the connection when idle
        testWhileIdle: true
        # Whether to test the validity of the connection when borrowing it
        testOnBorrow: false
        # Whether to test the validity of the connection when returning it
        testOnReturn: false
        # Whether to turn on the PreparedStatement cache of the connection pool
        poolPreparedStatements: true
        # PreparedStatement cache limit per connection pool
        maxPoolPreparedStatementPerConnectionSize: 20
        # Configure Druid filters
        filters: stat,slf4j
        # Druid connection property configuration
        connectionProperties: druid.stat.mergeSql\=true;druid.stat.slowSqlMillis\=5000
      datasource:
        # Main database data source configuration
        master:
          # Dynamically loaded configuration properties
          driver-class-name: ${${datasource.type}.driver-class-name}
          url: ${${datasource.type}.url}
          username: ${${datasource.type}.username}
          password: ${${datasource.type}.password}

# MySQL configuration file
mysql:
  # JDBC driver class name
  driver-class-name: com.mysql.cj.jdbc.Driver
  # Main library JDBC connection URL
  url: jdbc:mysql://mysql:3306/qdata?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
  # Main library username
  username: root
  # Main database password
  password: o5KjnPYxswsiURZHCPwd

# Dameng configuration file
dm8:
  # JDBC driver class name
  driver-class-name: dm.jdbc.driver.DmDriver
  # Main library JDBC connection URL
  url: jdbc:dm://127.0.0.1:5236/QDATA?STU&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=utf-8&schema=QDATA&serverTimezone=Asia/Shanghai
  # Main library username
  username: QDATA
  # Main database password
  password: 密码

